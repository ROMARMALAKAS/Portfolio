    <style>
      :root {
        --rv-primary: #2563eb;
        --rv-text: #0b0f1a;
        --rv-muted: #6b7280;
        --rv-bg: #fff;
        --rv-bg-soft: #f7f9ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --rv-text: #f1f5f9;
          --rv-muted: #94a3b8;
          --rv-bg: #0b0f1a;
          --rv-bg-soft: #0f172a;
        }
        body { background: var(--rv-bg); color: var(--rv-text); }
      }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--rv-bg);
        color: var(--rv-text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .rv-404 {
        max-width: 560px;
        text-align: center;
      }
      .rv-404-glyph {
        font-size: clamp(5rem, 18vw, 9rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 0.5rem;
      }
      .rv-404 h1 {
        font-size: clamp(1.4rem, 4vw, 1.9rem);
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      .rv-404 p {
        color: var(--rv-muted);
        margin-bottom: 1.5rem;
      }
      .btn-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        border: none;
        padding: 0.65rem 1.4rem;
        font-weight: 600;
      }
    </style>

  <body>
    <main class="rv-404">
      <div class="rv-404-glyph">404</div>
      <h1>Page not found</h1>
      <p>
        That link is either broken, moved, or never existed. Don't worry — there's
        plenty more on the homepage.
      </p>
      <a href="/" class="btn btn-primary btn-lg">
        <i class="bi bi-arrow-left-short"></i> Back to homepage
